[domains]
internal = ["stglaw.com.br", "stgadvogados.com.br"]

[hosts]
suffixes = ["sharepoint.com", "onmicrosoft.com", "vercel.app", "forms.cloud.microsoft"]

[allow]
# lock file and the demo's run output (git-ignored)
paths = ["uv.lock", ".demo/*", ".demo/**/*", "data/*"]
