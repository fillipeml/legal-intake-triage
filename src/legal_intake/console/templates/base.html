<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}Legal intake{% endblock %} · {{ firm }}</title>
  <style>
    :root { --ink:#17181c; --bg:#fbfaf7; --surface:#f2f1ec; --muted:#6b6f76; --line:#e4e3de; --accent:#4338ca; --accent-soft:#eef2ff; --ok:#047857; --ok-soft:#ecfdf5; --warn:#b45309; --warn-soft:#fffbeb; --bad:#b91c1c; --bad-soft:#fef2f2; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font: 14px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; }
    a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
    header { background:#fff; border-bottom:1px solid var(--line); }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
    header .wrap { display:flex; align-items:center; justify-content:space-between; gap:16px; height:56px; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:600; }
    .brand svg { width:32px; height:32px; }
    nav a { margin-left:16px; font-weight:600; font-size:13px; color:var(--muted); } nav a.on { color:var(--ink); }
    .badge { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:1px 9px; font-size:11px; font-weight:700; background:var(--surface); color:var(--muted); }
    .badge.accent { background:var(--accent-soft); border-color:#c7d2fe; color:var(--accent); }
    .badge.ok { background:var(--ok-soft); border-color:#a7f3d0; color:var(--ok); }
    .badge.warn { background:var(--warn-soft); border-color:#fde68a; color:var(--warn); }
    .badge.bad { background:var(--bad-soft); border-color:#fecaca; color:var(--bad); }
    main { padding: 24px 0 48px; }
    h1 { font-size: 20px; margin: 0 0 4px; } h2 { font-size: 15px; margin: 0; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px 20px; margin-bottom:16px; }
    .card h2 { border-left: 4px solid var(--accent); padding-left: 8px; font-size:12px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px; }
    .grid { display:grid; gap:16px; } .g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); } .g4 { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
    .kpi { background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px 16px; }
    .kpi .v { font-size: 24px; font-weight: 700; font-family: "JetBrains Mono", ui-monospace, monospace; } .kpi .l { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:700; }
    .bar { display:flex; align-items:center; gap:8px; margin:4px 0; font-size:13px; } .bar .n { width: 160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .bar .t { flex:1; background:var(--surface); border-radius:4px; height:12px; } .bar .m { background:var(--accent); height:12px; border-radius:4px; } .bar .c { width:32px; text-align:right; font-family: ui-monospace, monospace; }
    table { width:100%; border-collapse: collapse; font-size:13px; } th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); border-bottom:1px solid var(--line); padding:6px 8px; } td { padding:7px 8px; border-bottom:1px solid var(--line); vertical-align: top; }
    label { display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin:12px 0 4px; }
    input[type=text], input[type=number], input[type=email], input[type=password], select, textarea { width:100%; border:1px solid var(--line); border-radius:6px; padding:8px 10px; font: inherit; background:#fff; } textarea { min-height: 140px; }
    .btn { display:inline-block; border:0; border-radius:6px; padding:10px 18px; font: inherit; font-weight:700; text-transform:uppercase; letter-spacing:.05em; font-size:12px; cursor:pointer; color:#fff; background:var(--accent); } .btn.bad { background:var(--bad); } .btn.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
    .note { background:var(--warn-soft); border:1px solid #fde68a; border-radius:6px; padding:8px 12px; font-size:12px; color:var(--warn); margin:8px 0; }
    .ok-box { background:var(--ok-soft); border:1px solid #a7f3d0; border-radius:6px; padding:10px 14px; color:var(--ok); margin-bottom:16px; font-weight:600; }
    .bad-box { background:var(--bad-soft); border:1px solid #fecaca; border-radius:6px; padding:10px 14px; color:var(--bad); margin-bottom:16px; font-weight:600; }
    .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; }
    footer { color:var(--muted); font-size:12px; text-align:center; padding:16px; border-top:1px solid var(--line); }
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 64 64" role="img" aria-label="monogram"><rect width="64" height="64" rx="12" fill="#17181C"/><g fill="#FBFAF7"><rect x="13" y="16" width="6" height="32"/><rect x="13" y="16" width="19" height="6"/><rect x="13" y="29" width="15" height="6"/></g><g fill="#4338CA"><rect x="37" y="16" width="6" height="32"/><rect x="37" y="42" width="15" height="6"/></g></svg>
      <span>Legal intake</span>
      {% if demo %}<span class="badge accent" title="Fixture inbox, recorded triage, SQLite state, e-mails written to .demo/outbox">Demo</span>{% endif %}
    </div>
    <nav>
      <a href="/" class="{% if request.url.path == '/' %}on{% endif %}">Dashboard</a>
      <a href="/cards" class="{% if request.url.path.startswith('/cards') %}on{% endif %}">Cards</a>
      {% if user %}<span class="badge" style="margin-left:16px">{{ user }}</span>{% endif %}
      {% if protected and user %}<form method="post" action="/sign-out" style="display:inline"><button class="btn ghost" style="margin-left:8px;padding:4px 10px">Sign out</button></form>{% endif %}
    </nav>
  </div>
</header>
<main><div class="wrap">{% block content %}{% endblock %}</div></main>
<footer>Legal intake · the model prepares, a person decides, the approval creates the task, the record and the reply</footer>
</body>
</html>
