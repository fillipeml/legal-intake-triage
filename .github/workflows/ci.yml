name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: lint + tests + demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync --locked --dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests (offline)
        run: uv run pytest -q

      - name: Fixtures are current
        run: |
          uv run python scripts/make_fixtures.py
          git diff --exit-code --stat -- fixtures

      - name: Demo walkthrough (the second sweep must send nothing)
        run: |
          uv run intake --demo sweep
          uv run intake --demo sweep | tee sweep2.txt
          grep -q "registered=0" sweep2.txt
          uv run intake --demo pending
          uv run intake --demo decide d-$(printf m01 | sha1sum | cut -c1-8) --approve --by bruno.costa@lawfirm.example
          uv run intake --demo decide d-$(printf m14 | sha1sum | cut -c1-8) --discard --by ana.ribeiro@lawfirm.example
          uv run intake --demo decide d-$(printf m01 | sha1sum | cut -c1-8) --discard --by ana.ribeiro@lawfirm.example | tee race.txt
          grep -q "already decided" race.txt
          uv run intake --demo sync-board
          uv run intake --demo stats
          uv run intake --demo sla --history fixtures/sla/history.csv
          ls .demo/outbox

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
